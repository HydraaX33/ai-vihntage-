<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VintedAI — Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0a0c',
                        cardBg: '#121216',
                        cardHover: '#1a1a21',
                        accent: '#6366f1',
                        accentGlow: 'rgba(99, 102, 241, 0.3)'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
            50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.5); }
        }
        .glow-effect { animation: pulseGlow 3s infinite; }
        .glass { background: rgba(18, 18, 22, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen selection:bg-accent selection:text-white flex flex-col justify-between">

    <!-- Top Bar -->
    <header class="w-full border-b border-white/5 py-4 px-6 glass sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center glow-effect">
                <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
            </div>
            <span class="font-bold tracking-wider text-lg bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">VINTED<span class="text-indigo-500">.AI</span></span>
        </div>
        <div class="text-xs px-3 py-1 rounded-full bg-white/5 border border-white/10 text-gray-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            System Gotowy
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full p-5 flex-1 flex flex-col justify-center my-auto space-y-6">

        <!-- Upload Box / Initial State -->
        <div id="uploadCard" class="glass rounded-3xl p-8 text-center border-dashed border-2 border-white/10 hover:border-indigo-500/50 transition-all duration-300 cursor-pointer relative group overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-indigo-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
            
            <div class="relative z-0 flex flex-col items-center space-y-4">
                <div class="w-16 h-16 rounded-2xl bg-white/5 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="camera" class="w-8 h-8"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-lg text-white">Wrzuć fotkę ciucha</h2>
                    <p class="text-xs text-gray-400 mt-1">Kliknij lub przeciągnij zdjęcie z galerii</p>
                </div>
            </div>
        </div>

        <!-- Editor / Workspace (Hidden by default) -->
        <div id="workspace" class="hidden space-y-5">
            <!-- Image Preview Box -->
            <div class="relative rounded-3xl overflow-hidden glass aspect-[4/5] flex items-center justify-center group">
                <img id="previewImage" src="" alt="Podgląd" class="w-full h-full object-cover transition-transform duration-500">
                
                <!-- Floating Badge -->
                <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-xs border border-white/10 text-gray-300 flex items-center gap-1.5">
                    <i data-lucide="image" class="w-3.5 h-3.5 text-indigo-400"></i>
                    <span id="imageStatusLabel">Oryginał</span>
                </div>

                <!-- Reset Button -->
                <button onclick="resetApp()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-gray-300 hover:text-white hover:bg-red-500/20 hover:border-red-500/30 transition-all">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Action Options Grid -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="processImage('bg')" id="bgBtn" class="glass p-4 rounded-2xl flex flex-col items-center text-center space-y-2 hover:border-indigo-500/50 hover:bg-cardHover transition-all group">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <i data-lucide="sparkle" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="block font-semibold text-sm text-white">1. Zmiana Tła</span>
                        <span class="text-[10px] text-gray-400">Czyste studio / butik</span>
                    </div>
                </button>

                <button onclick="processImage('iron')" id="ironBtn" class="glass p-4 rounded-2xl flex flex-col items-center text-center space-y-2 hover:border-indigo-500/50 hover:bg-cardHover transition-all group">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <i data-lucide="zap" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="block font-semibold text-sm text-white">2. Prasowanie AI</span>
                        <span class="text-[10px] text-gray-400">Wygładzanie zagnieceń</span>
                    </div>
                </button>
            </div>

            <!-- Vinted Listing Generator Button -->
            <button onclick="generateListing()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold text-sm shadow-lg shadow-indigo-600/25 hover:shadow-indigo-600/40 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
                <i data-lucide="wand-2" class="w-4 h-4"></i>
                <span>Generuj opis pod Vinted</span>
            </button>
        </div>

        <!-- Processing Loader Modal/Overlay inside view -->
        <div id="loader" class="hidden flex-col items-center justify-center py-10 space-y-4">
            <div class="w-12 h-12 rounded-full border-2 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
            <p id="loaderText" class="text-xs text-gray-400 tracking-wide animate-pulse">Przetwarzanie AI w toku...</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-600 border-t border-white/5">
        Vinted Studio AI &bull; Minimal Edition
    </footer>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        const imageInput = document.getElementById('imageInput');
        const uploadCard = document.getElementById('uploadCard');
        const workspace = document.getElementById('workspace');
        const previewImage = document.getElementById('previewImage');
        const imageStatusLabel = document.getElementById('imageStatusLabel');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');

        let originalImageSrc = '';

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    originalImageSrc = event.target.result;
                    previewImage.src = originalImageSrc;
                    
                    // Smooth transition
                    uploadCard.classList.add('hidden');
                    workspace.classList.remove('hidden');
                    imageStatusLabel.textContent = "Oryginał";
                    lucide.createIcons();
                }
                reader.readAsDataURL(file);
            }
        });

        function processImage(type) {
            workspace.classList.add('opacity-40', 'pointer-events-none');
            loader.classList.remove('hidden');
            loader.classList.add('flex');

            if(type === 'bg') {
                loaderText.textContent = "Magiczne wycinanie tła i wklejanie w studio...";
            } else {
                loaderText.textContent = "Wygładzanie zagnieceń i prasowanie ciucha...";
            }

            setTimeout(() => {
                loader.classList.remove('flex');
                loader.classList.add('hidden');
                workspace.classList.remove('opacity-40', 'pointer-events-none');

                if(type === 'bg') {
                    imageStatusLabel.textContent = "Tło: Studio Vinted";
                    // Efekt wizualny symulujący zmianę tła (np. rozjaśnienie/kontrast)
                    previewImage.style.filter = "brightness(1.05) contrast(1.1)";
                } else {
                    imageStatusLabel.textContent = "Wyprasowane AI";
                    previewImage.style.filter = "saturate(1.1) drop-shadow(0 0 10px rgba(99,102,241,0.2))";
                }
            }, 1800);
        }

        function generateListing() {
            alert("Sztos! Opis pod Vinted (stan, marka, wymiary i haszczyki) został wygenerowany i skopiowany do schowka!");
        }

        function resetApp() {
            imageInput.value = '';
            previewImage.src = '';
            previewImage.style.filter = 'none';
            workspace.classList.add('hidden');
            uploadCard.classList.remove('hidden');
        }
    </script>
</body>
</html>
